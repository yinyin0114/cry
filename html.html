<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 自然选择与进化模拟器</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            padding: 16px;
        }

        .app-container {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #161b22;
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid #30363d;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #58a6ff, #3fb950);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .stats {
            display: flex;
            gap: 24px;
            font-size: 14px;
            flex-wrap: wrap;
        }
        .header .stats span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header .stats .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
        }
        .badge-collector {
            background: #1f6feb33;
            color: #58a6ff;
            border: 1px solid #58a6ff55;
        }
        .badge-predator {
            background: #da363355;
            color: #f85149;
            border: 1px solid #f8514955;
        }
        .badge-food {
            background: #2ea04333;
            color: #3fb950;
            border: 1px solid #3fb95055;
        }
        .badge-time {
            background: #8b949e22;
            color: #8b949e;
            border: 1px solid #8b949e44;
        }

        .main-area {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .control-panel {
            flex: 0 0 300px;
            min-width: 260px;
            background: #161b22;
            border-radius: 12px;
            border: 1px solid #30363d;
            padding: 16px 18px;
            max-height: 780px;
            overflow-y: auto;
        }
        .control-panel::-webkit-scrollbar {
            width: 4px;
        }
        .control-panel::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }

        .control-panel h3 {
            font-size: 15px;
            font-weight: 500;
            color: #8b949e;
            margin: 14px 0 8px 0;
            border-bottom: 1px solid #21262d;
            padding-bottom: 6px;
        }
        .control-panel h3:first-of-type {
            margin-top: 0;
        }

        .param-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 12px;
            margin-bottom: 6px;
        }
        .param-group label {
            font-size: 13px;
            color: #8b949e;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .param-group input {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e6edf3;
            padding: 4px 8px;
            font-size: 13px;
            width: 100%;
            transition: border 0.2s;
        }
        .param-group input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .param-group input[type="number"] {
            -moz-appearance: textfield;
        }
        .param-group input[type="number"]::-webkit-outer-spin-button,
        .param-group input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }
        .param-group .range-label {
            font-size: 12px;
            color: #8b949e;
            grid-column: span 2;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .param-group .range-label input {
            width: 44%;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin: 14px 0 6px 0;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            min-width: 70px;
        }
        .btn-primary {
            background: #238636;
            color: #fff;
        }
        .btn-primary:hover {
            background: #2ea043;
        }
        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-warning {
            background: #d29922;
            color: #fff;
        }
        .btn-warning:hover {
            background: #e3b341;
        }
        .btn-danger {
            background: #da3633;
            color: #fff;
        }
        .btn-danger:hover {
            background: #f85149;
        }
        .btn-secondary {
            background: #21262d;
            color: #c9d1d9;
        }
        .btn-secondary:hover {
            background: #30363d;
        }

        .hint {
            font-size: 12px;
            color: #8b949e;
            margin-top: 10px;
            line-height: 1.6;
            border-top: 1px solid #21262d;
            padding-top: 10px;
        }

        .canvas-wrapper {
            flex: 1;
            min-width: 500px;
            background: #0d1117;
            border-radius: 12px;
            border: 1px solid #30363d;
            position: relative;
            overflow: hidden;
        }
        .canvas-wrapper canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 10;
            background: #0d1117;
            cursor: crosshair;
        }

        .chart-area {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 14px;
            flex-wrap: wrap;
        }
        .chart-box {
            background: #161b22;
            border-radius: 12px;
            border: 1px solid #30363d;
            padding: 12px 14px 8px 14px;
            min-height: 200px;
            position: relative;
        }
        .chart-box h4 {
            font-size: 13px;
            font-weight: 500;
            color: #8b949e;
            margin-bottom: 6px;
            text-align: center;
        }
        .chart-box canvas {
            width: 100% !important;
            height: 160px !important;
        }

        @media (max-width: 960px) {
            .main-area {
                flex-direction: column;
            }
            .control-panel {
                flex: 1;
                max-height: 400px;
            }
            .canvas-wrapper {
                min-width: 0;
            }
            .chart-area {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 600px) {
            .chart-area {
                grid-template-columns: 1fr;
            }
            .header .stats {
                gap: 12px;
                font-size: 12px;
            }
            .param-group {
                grid-template-columns: 1fr 1fr;
            }
            .control-panel {
                padding: 12px;
            }
        }

        .canvas-legend {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: #161b22cc;
            backdrop-filter: blur(4px);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            display: flex;
            gap: 14px;
            border: 1px solid #30363d55;
            pointer-events: none;
        }
        .canvas-legend .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 2px;
            margin-right: 4px;
            vertical-align: middle;
        }
        .canvas-legend .dot.circle {
            border-radius: 50%;
        }
        .canvas-legend .dot.green {
            background: #3fb950;
            border-radius: 50%;
            width: 10px;
            height: 10px;
        }

        .status-tip {
            font-size: 13px;
            color: #8b949e;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-tip .led {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .led-green {
            background: #3fb950;
            box-shadow: 0 0 8px #3fb95088;
        }
        .led-red {
            background: #f85149;
            box-shadow: 0 0 8px #f8514988;
        }
        .led-yellow {
            background: #d29922;
            box-shadow: 0 0 8px #d2992288;
        }
    </style>
</head>
<body>

    <div class="app-container">

        <div class="header">
            <h1>🌿 自然选择 · 进化模拟器</h1>
            <div class="stats">
                <span><span class="badge badge-collector">⬛ 采集者 <span id="countCollector">0</span></span></span>
                <span><span class="badge badge-predator">⬤ 捕猎者 <span id="countPredator">0</span></span></span>
                <span><span class="badge badge-food">● 食物 <span id="countFood">0</span></span></span>
                <span><span class="badge badge-time">⏱ <span id="simTime">0.0</span>s</span></span>
                <span class="status-tip"><span class="led led-green" id="statusLed"></span><span id="statusText">就绪</span></span>
            </div>
        </div>

        <div class="main-area">
            <div class="control-panel" id="controlPanel">
                <h3>🧬 采集者 (方块)</h3>
                <div class="param-group">
                    <label>初始大小</label>
                    <input type="number" id="collectorSize" value="10" step="1" min="2" max="50">
                    <label>初始速度</label>
                    <input type="number" id="collectorSpeed" value="2" step="0.5" min="0.5" max="10">
                    <label>初始数量</label>
                    <input type="number" id="collectorCount" value="10" step="1" min="1" max="50">
                    <label class="range-label">体积变化区间
                        <input type="number" id="collectorSizeMin" value="-5" step="1" min="-20" max="0">
                        ~
                        <input type="number" id="collectorSizeMax" value="5" step="1" min="0" max="20">
                    </label>
                    <label class="range-label">速度变化区间
                        <input type="number" id="collectorSpeedMin" value="-3" step="0.5" min="-10" max="0">
                        ~
                        <input type="number" id="collectorSpeedMax" value="3" step="0.5" min="0" max="10">
                    </label>
                </div>

                <h3>🐾 捕猎者 (圆球)</h3>
                <div class="param-group">
                    <label>初始大小</label>
                    <input type="number" id="predatorSize" value="20" step="1" min="4" max="80">
                    <label>初始速度</label>
                    <input type="number" id="predatorSpeed" value="1" step="0.5" min="0.3" max="8">
                    <label>初始数量</label>
                    <input type="number" id="predatorCount" value="2" step="1" min="0" max="30">
                    <label class="range-label">体积变化区间
                        <input type="number" id="predatorSizeMin" value="-10" step="1" min="-30" max="0">
                        ~
                        <input type="number" id="predatorSizeMax" value="10" step="1" min="0" max="30">
                    </label>
                    <label class="range-label">速度变化区间
                        <input type="number" id="predatorSpeedMin" value="-4" step="0.5" min="-12" max="0">
                        ~
                        <input type="number" id="predatorSpeedMax" value="4" step="0.5" min="0" max="12">
                    </label>
                </div>

                <h3>⚙️ 全局参数</h3>
                <div class="param-group">
                    <label>捕食时间</label>
                    <input type="number" id="huntTime" value="1.5" step="0.1" min="0.3" max="10">
                    <label>分裂间隔</label>
                    <input type="number" id="splitInterval" value="10" step="1" min="3" max="60">
                    <label>食物数量</label>
                    <input type="number" id="foodCount" value="60" step="5" min="10" max="200">
                    <label>安全距离</label>
                    <input type="number" id="safeDistance" value="80" step="5" min="20" max="300">
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" id="btnStart">▶ 开始</button>
                    <button class="btn btn-warning" id="btnPause" disabled>⏸ 暂停</button>
                    <button class="btn btn-danger" id="btnReset">⟳ 重置</button>
                </div>

                <div class="hint">
                    💡 <b>采集者</b>（蓝方块）觅食绿点，躲避捕猎者。<br>
                    💡 <b>捕猎者</b>（红圆）追逐采集者，接触满 <span id="hintHuntTime">1.5</span>s 即进食。<br>
                    💡 进食后体积/速度按区间随机变化，定期分裂繁殖。
                </div>
            </div>

            <div class="canvas-wrapper">
                <canvas id="simCanvas" width="1000" height="625"></canvas>
                <div class="canvas-legend">
                    <span><span class="dot" style="background:#58a6ff;"></span>采集者</span>
                    <span><span class="dot circle" style="background:#f85149;"></span>捕猎者</span>
                    <span><span class="dot green"></span>食物</span>
                </div>
            </div>
        </div>

        <div class="chart-area">
            <div class="chart-box">
                <h4>📊 种群数量</h4>
                <canvas id="chartPopulation"></canvas>
            </div>
            <div class="chart-box">
                <h4>📈 平均体积</h4>
                <canvas id="chartSize"></canvas>
            </div>
            <div class="chart-box">
                <h4>📉 平均速度</h4>
                <canvas id="chartSpeed"></canvas>
            </div>
        </div>

    </div>

    <script>
        // ============================================================
        //  自然选择与进化模拟器  —  完整逻辑 (重置已修复)
        // ============================================================

        // ---------- DOM 引用 ----------
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        const $ = id => document.getElementById(id);
        const countCollector = $('countCollector');
        const countPredator = $('countPredator');
        const countFood = $('countFood');
        const simTime = $('simTime');
        const statusText = $('statusText');
        const statusLed = $('statusLed');
        const hintHuntTime = $('hintHuntTime');

        const btnStart = $('btnStart');
        const btnPause = $('btnPause');
        const btnReset = $('btnReset');

        // ---------- 参数读取 ----------
        function getParams() {
            return {
                collectorSize: parseFloat($('collectorSize').value) || 10,
                collectorSpeed: parseFloat($('collectorSpeed').value) || 2,
                collectorCount: parseInt($('collectorCount').value) || 10,
                collectorSizeMin: parseFloat($('collectorSizeMin').value) || -5,
                collectorSizeMax: parseFloat($('collectorSizeMax').value) || 5,
                collectorSpeedMin: parseFloat($('collectorSpeedMin').value) || -3,
                collectorSpeedMax: parseFloat($('collectorSpeedMax').value) || 3,

                predatorSize: parseFloat($('predatorSize').value) || 20,
                predatorSpeed: parseFloat($('predatorSpeed').value) || 1,
                predatorCount: parseInt($('predatorCount').value) || 2,
                predatorSizeMin: parseFloat($('predatorSizeMin').value) || -10,
                predatorSizeMax: parseFloat($('predatorSizeMax').value) || 10,
                predatorSpeedMin: parseFloat($('predatorSpeedMin').value) || -4,
                predatorSpeedMax: parseFloat($('predatorSpeedMax').value) || 4,

                huntTime: parseFloat($('huntTime').value) || 1.5,
                splitInterval: parseFloat($('splitInterval').value) || 10,
                foodCount: parseInt($('foodCount').value) || 60,
                safeDistance: parseFloat($('safeDistance').value) || 80,
            };
        }

        // ---------- 全局状态 ----------
        let running = false;
        let paused = false;
        let simClock = 0;
        let frameId = null;
        let lastTimestamp = 0;
        let deltaAccum = 0;
        const STEP_DT = 1 / 60;

        let collectors = [];
        let predators = [];
        let foods = [];

        const MAX_HISTORY = 300;
        let history = {
            time: [],
            collectorCount: [],
            predatorCount: [],
            collectorAvgSize: [],
            predatorAvgSize: [],
            collectorAvgSpeed: [],
            predatorAvgSpeed: [],
        };

        let chartPop = null;
        let chartSize = null;
        let chartSpeed = null;

        let nextId = 1;
        const W = 1000;
        const H = 625;

        // ---------- 工具函数 ----------
        function rand(min, max) { return min + Math.random() * (max - min); }

        function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

        function lerp(a, b, t) { return a + (b - a) * t; }

        function randomPos() { return { x: rand(20, W - 20), y: rand(20, H - 20) }; }

        // ---------- 生物类 ----------
        class Organism {
            constructor(type, x, y, size, speed) {
                this.id = nextId++;
                this.type = type;
                this.x = x;
                this.y = y;
                this.size = size;
                this.speed = speed;
                this.vx = rand(-1, 1);
                this.vy = rand(-1, 1);
                const len = Math.hypot(this.vx, this.vy) || 1;
                this.vx /= len;
                this.vy /= len;
                this.alive = true;
                this.age = 0;
                this.splitTimer = 0;
                this.target = null;
                this.huntTime = 0;
                this.escapeDir = null;
            }

            get radius() {
                return this.type === 'collector' ? this.size * 0.5 : this.size;
            }

            steer(tx, ty, strength = 1) {
                const dx = tx - this.x;
                const dy = ty - this.y;
                const len = Math.hypot(dx, dy);
                if (len < 0.001) return;
                const nx = dx / len;
                const ny = dy / len;
                this.vx = lerp(this.vx, nx, strength * 0.06);
                this.vy = lerp(this.vy, ny, strength * 0.06);
                const l = Math.hypot(this.vx, this.vy);
                if (l > 0.001) { this.vx /= l;
                    this.vy /= l; }
            }

            wobble(amount = 0.08) {
                this.vx += rand(-amount, amount);
                this.vy += rand(-amount, amount);
                const l = Math.hypot(this.vx, this.vy);
                if (l > 0.001) { this.vx /= l;
                    this.vy /= l; }
            }

            move(speed) {
                const spd = speed || this.speed;
                this.x += this.vx * spd;
                this.y += this.vy * spd;
                const r = this.radius;
                if (this.x < r) { this.x = r;
                    this.vx = Math.abs(this.vx); }
                if (this.x > W - r) { this.x = W - r;
                    this.vx = -Math.abs(this.vx); }
                if (this.y < r) { this.y = r;
                    this.vy = Math.abs(this.vy); }
                if (this.y > H - r) { this.y = H - r;
                    this.vy = -Math.abs(this.vy); }
                this.age += STEP_DT;
                this.splitTimer += STEP_DT;
            }

            split() {
                const childSize = this.size * rand(0.35, 0.65);
                const childSpeed = this.speed * rand(0.35, 0.65);
                const p1 = {
                    x: this.x + rand(-8, 8),
                    y: this.y + rand(-8, 8),
                    size: childSize,
                    speed: childSpeed
                };
                const p2 = {
                    x: this.x + rand(-8, 8),
                    y: this.y + rand(-8, 8),
                    size: this.size - childSize,
                    speed: this.speed - childSpeed
                };
                p1.size = Math.max(2, p1.size);
                p2.size = Math.max(2, p2.size);
                p1.speed = Math.max(0.3, p1.speed);
                p2.speed = Math.max(0.3, p2.speed);
                if (this.size < 4 || this.speed < 0.5) return null;
                return [p1, p2];
            }
        }

        // ---------- 创建初始种群 ----------
        function createInitialPopulation(params) {
            const {
                collectorSize, collectorSpeed, collectorCount,
                predatorSize, predatorSpeed, predatorCount,
                foodCount
            } = params;

            const cols = [];
            for (let i = 0; i < collectorCount; i++) {
                const p = randomPos();
                cols.push(new Organism('collector', p.x, p.y,
                    collectorSize + rand(-2, 2),
                    collectorSpeed + rand(-0.5, 0.5)
                ));
            }

            const preds = [];
            for (let i = 0; i < predatorCount; i++) {
                const p = randomPos();
                preds.push(new Organism('predator', p.x, p.y,
                    predatorSize + rand(-3, 3),
                    predatorSpeed + rand(-0.3, 0.3)
                ));
            }

            const foods_arr = [];
            for (let i = 0; i < foodCount; i++) {
                const p = randomPos();
                foods_arr.push({ x: p.x, y: p.y, radius: 3, alive: true });
            }

            return { collectors: cols, predators: preds, foods: foods_arr };
        }

        // ---------- 重置模拟 (核心修复) ----------
        function resetSimulation() {
            // 1. 停止所有循环
            if (frameId) {
                cancelAnimationFrame(frameId);
                frameId = null;
            }
            running = false;
            paused = false;
            deltaAccum = 0;
            lastTimestamp = 0;
            simClock = 0;

            // 2. 重置按钮状态
            btnStart.disabled = false;
            btnPause.disabled = true;
            btnPause.textContent = '⏸ 暂停';
            statusText.textContent = '就绪';
            statusLed.className = 'led led-green';

            // 3. 创建初始种群
            const params = getParams();
            const pop = createInitialPopulation(params);
            collectors = pop.collectors;
            predators = pop.predators;
            foods = pop.foods;

            // 4. 重置历史数据
            history = {
                time: [],
                collectorCount: [],
                predatorCount: [],
                collectorAvgSize: [],
                predatorAvgSize: [],
                collectorAvgSpeed: [],
                predatorAvgSpeed: [],
            };

            // 5. 重置图表
            initCharts();
            updateStats();
            drawCanvas();
            hintHuntTime.textContent = params.huntTime.toFixed(1);
        }

        // ---------- 初始化图表 ----------
        function initCharts() {
            const commonOpts = {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                plugins: {
                    legend: {
                        labels: {
                            color: '#8b949e',
                            font: { size: 10, weight: '400' },
                            boxWidth: 12,
                            padding: 8,
                        }
                    }
                },
                scales: {
                    x: {
                        ticks: { color: '#484f58', font: { size: 9 }, maxTicksLimit: 8 },
                        grid: { color: '#21262d' },
                        title: { color: '#484f58', display: true, text: '时间 (s)', font: { size: 9 } }
                    },
                    y: {
                        ticks: { color: '#484f58', font: { size: 9 } },
                        grid: { color: '#21262d' },
                        beginAtZero: true,
                    }
                }
            };

            const ctxPop = document.getElementById('chartPopulation').getContext('2d');
            if (chartPop) chartPop.destroy();
            chartPop = new Chart(ctxPop, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: '采集者',
                        data: [],
                        borderColor: '#58a6ff',
                        backgroundColor: '#58a6ff22',
                        pointRadius: 0,
                        borderWidth: 2,
                        tension: 0.3,
                        fill: true,
                    }, {
                        label: '捕猎者',
                        data: [],
                        borderColor: '#f85149',
                        backgroundColor: '#f8514922',
                        pointRadius: 0,
                        borderWidth: 2,
                        tension: 0.3,
                        fill: true,
                    }]
                },
                options: {
                    ...commonOpts,
                    scales: {
                        ...commonOpts.scales,
                        y: { ...commonOpts.scales.y, beginAtZero: true }
                    }
                }
            });

            const ctxSize = document.getElementById('chartSize').getContext('2d');
            if (chartSize) chartSize.destroy();
            chartSize = new Chart(ctxSize, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: '采集者',
                        data: [],
                        borderColor: '#58a6ff',
                        backgroundColor: '#58a6ff22',
                        pointRadius: 0,
                        borderWidth: 2,
                        tension: 0.3,
                    }, {
                        label: '捕猎者',
                        data: [],
                        borderColor: '#f85149',
                        backgroundColor: '#f8514922',
                        pointRadius: 0,
                        borderWidth: 2,
                        tension: 0.3,
                    }]
                },
                options: {
                    ...commonOpts,
                    scales: {
                        ...commonOpts.scales,
                        y: { ...commonOpts.scales.y, beginAtZero: true }
                    }
                }
            });

            const ctxSpeed = document.getElementById('chartSpeed').getContext('2d');
            if (chartSpeed) chartSpeed.destroy();
            chartSpeed = new Chart(ctxSpeed, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: '采集者',
                        data: [],
                        borderColor: '#58a6ff',
                        backgroundColor: '#58a6ff22',
                        pointRadius: 0,
                        borderWidth: 2,
                        tension: 0.3,
                    }, {
                        label: '捕猎者',
                        data: [],
                        borderColor: '#f85149',
                        backgroundColor: '#f8514922',
                        pointRadius: 0,
                        borderWidth: 2,
                        tension: 0.3,
                    }]
                },
                options: {
                    ...commonOpts,
                    scales: {
                        ...commonOpts.scales,
                        y: { ...commonOpts.scales.y, beginAtZero: true }
                    }
                }
            });
        }

        // ---------- 更新图表数据 ----------
        function updateCharts() {
            const h = history;
            const len = h.time.length;
            if (len === 0) return;

            const labels = h.time.map(t => t.toFixed(1));

            chartPop.data.labels = labels;
            chartPop.data.datasets[0].data = h.collectorCount;
            chartPop.data.datasets[1].data = h.predatorCount;
            chartPop.update('none');

            chartSize.data.labels = labels;
            chartSize.data.datasets[0].data = h.collectorAvgSize;
            chartSize.data.datasets[1].data = h.predatorAvgSize;
            chartSize.update('none');

            chartSpeed.data.labels = labels;
            chartSpeed.data.datasets[0].data = h.collectorAvgSpeed;
            chartSpeed.data.datasets[1].data = h.predatorAvgSpeed;
            chartSpeed.update('none');
        }

        // ---------- 记录数据 ----------
        function recordData() {
            const cCount = collectors.filter(c => c.alive).length;
            const pCount = predators.filter(p => p.alive).length;

            let cSize = 0,
                cSpeed = 0;
            const cAlive = collectors.filter(c => c.alive);
            cAlive.forEach(c => { cSize += c.size;
                cSpeed += c.speed; });
            const cAvgSize = cAlive.length ? cSize / cAlive.length : 0;
            const cAvgSpeed = cAlive.length ? cSpeed / cAlive.length : 0;

            let pSize = 0,
                pSpeed = 0;
            const pAlive = predators.filter(p => p.alive);
            pAlive.forEach(p => { pSize += p.size;
                pSpeed += p.speed; });
            const pAvgSize = pAlive.length ? pSize / pAlive.length : 0;
            const pAvgSpeed = pAlive.length ? pSpeed / pAlive.length : 0;

            history.time.push(simClock);
            history.collectorCount.push(cCount);
            history.predatorCount.push(pCount);
            history.collectorAvgSize.push(cAvgSize);
            history.predatorAvgSize.push(pAvgSize);
            history.collectorAvgSpeed.push(cAvgSpeed);
            history.predatorAvgSpeed.push(pAvgSpeed);

            if (history.time.length > MAX_HISTORY) {
                for (const key in history) {
                    history[key].shift();
                }
            }
        }

        // ---------- 更新统计显示 ----------
        function updateStats() {
            const cCount = collectors.filter(c => c.alive).length;
            const pCount = predators.filter(p => p.alive).length;
            const fCount = foods.filter(f => f.alive).length;
            countCollector.textContent = cCount;
            countPredator.textContent = pCount;
            countFood.textContent = fCount;
            simTime.textContent = simClock.toFixed(1);
        }

        // ---------- 绘制画布 ----------
        function drawCanvas() {
            ctx.clearRect(0, 0, W, H);

            ctx.strokeStyle = '#1c2333';
            ctx.lineWidth = 0.5;
            for (let x = 0; x <= W; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, H);
                ctx.stroke();
            }
            for (let y = 0; y <= H; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke();
            }

            foods.forEach(f => {
                if (!f.alive) return;
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#3fb950';
                ctx.shadowColor = '#3fb95066';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            collectors.forEach(c => {
                if (!c.alive) return;
                const half = c.size / 2;
                const x = c.x - half,
                    y = c.y - half;
                ctx.fillStyle = '#58a6ff';
                ctx.shadowColor = '#58a6ff44';
                ctx.shadowBlur = 12;
                ctx.fillRect(x, y, c.size, c.size);
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#79c0ff88';
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, c.size, c.size);
                const ex = c.x + c.vx * c.size * 0.5;
                const ey = c.y + c.vy * c.size * 0.5;
                ctx.fillStyle = '#ffffff88';
                ctx.beginPath();
                ctx.arc(ex - c.vx * 3, ey - c.vy * 3, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(ex + c.vx * 3, ey + c.vy * 3, 2, 0, Math.PI * 2);
                ctx.fill();
            });

            predators.forEach(p => {
                if (!p.alive) return;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                const grad = ctx.createRadialGradient(p.x - p.size * 0.3, p.y - p.size * 0.3, 0, p.x, p.y, p.size);
                grad.addColorStop(0, '#ff7b72');
                grad.addColorStop(0.7, '#da3633');
                grad.addColorStop(1, '#7a1f1f');
                ctx.fillStyle = grad;
                ctx.shadowColor = '#f8514966';
                ctx.shadowBlur = 16;
                ctx.fill();
                ctx.shadowBlur = 0;
                const ex = p.x + p.vx * p.size * 0.6;
                const ey = p.y + p.vy * p.size * 0.6;
                ctx.fillStyle = '#ffffffcc';
                ctx.beginPath();
                ctx.arc(ex - p.vx * 4, ey - p.vy * 4, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(ex + p.vx * 4, ey + p.vy * 4, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#1a1a2e';
                ctx.beginPath();
                ctx.arc(ex - p.vx * 5, ey - p.vy * 5, 1.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(ex + p.vx * 5, ey + p.vy * 5, 1.8, 0, Math.PI * 2);
                ctx.fill();

                if (p.target) {
                    const progress = p.huntTime / getParams().huntTime;
                    if (progress > 0 && progress < 1) {
                        const barW = p.size * 1.6;
                        const barH = 4;
                        const bx = p.x - barW / 2;
                        const by = p.y - p.size - 10;
                        ctx.fillStyle = '#30363d';
                        ctx.fillRect(bx, by, barW, barH);
                        ctx.fillStyle = '#f0883e';
                        ctx.fillRect(bx, by, barW * progress, barH);
                        ctx.strokeStyle = '#8b949e44';
                        ctx.lineWidth = 0.5;
                        ctx.strokeRect(bx, by, barW, barH);
                    }
                }
            });

            predators.forEach(p => {
                if (!p.alive || !p.target) return;
                const target = collectors.find(c => c.id === p.target && c.alive);
                if (target) {
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(target.x, target.y);
                    ctx.strokeStyle = '#f8514933';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([4, 6]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                } else {
                    p.target = null;
                    p.huntTime = 0;
                }
            });

            ctx.fillStyle = '#8b949e66';
            ctx.font = '12px monospace';
            ctx.fillText(`采集: ${collectors.filter(c=>c.alive).length}  捕猎: ${predators.filter(p=>p.alive).length}  食物: ${foods.filter(f=>f.alive).length}`, 12, 22);
        }

        // ---------- 模拟逻辑 (一帧) ----------
        function simulateStep() {
            const params = getParams();
            const {
                huntTime: HUNT_TIME,
                splitInterval: SPLIT_INTERVAL,
                safeDistance: SAFE_DIST,
                collectorSizeMin, collectorSizeMax, collectorSpeedMin, collectorSpeedMax,
                predatorSizeMin, predatorSizeMax, predatorSpeedMin, predatorSpeedMax,
            } = params;

            const aliveCollectors = collectors.filter(c => c.alive);
            const alivePredators = predators.filter(p => p.alive);
            const aliveFoods = foods.filter(f => f.alive);

            for (const c of aliveCollectors) {
                let nearPred = null;
                let nearDist = Infinity;
                for (const p of alivePredators) {
                    const d = dist(c, p);
                    if (d < nearDist) { nearDist = d;
                        nearPred = p; }
                }

                let nearFood = null;
                let nearFoodDist = Infinity;
                for (const f of aliveFoods) {
                    const d = dist(c, f);
                    if (d < nearFoodDist) { nearFoodDist = d;
                        nearFood = f; }
                }

                const escapeThreshold = SAFE_DIST + c.size * 0.5;
                if (nearPred && nearDist < escapeThreshold) {
                    const dx = c.x - nearPred.x;
                    const dy = c.y - nearPred.y;
                    const len = Math.hypot(dx, dy) || 1;
                    const tx = c.x + (dx / len) * 80;
                    const ty = c.y + (dy / len) * 80;
                    c.steer(tx, ty, 1.2);
                    c.wobble(0.04);
                } else if (nearFood) {
                    c.steer(nearFood.x, nearFood.y, 0.9);
                    c.wobble(0.03);
                    if (nearFoodDist < c.size * 0.6 + nearFood.radius) {
                        nearFood.alive = false;
                        const dSize = rand(collectorSizeMin, collectorSizeMax);
                        c.size = Math.max(3, c.size + dSize);
                        const dSpeed = rand(collectorSpeedMin, collectorSpeedMax);
                        c.speed = Math.max(0.3, c.speed + dSpeed);
                        c.wobble(0.1);
                    }
                } else {
                    c.wobble(0.05);
                    if (Math.random() < 0.01) {
                        c.vx = rand(-1, 1);
                        c.vy = rand(-1, 1);
                        const l = Math.hypot(c.vx, c.vy) || 1;
                        c.vx /= l;
                        c.vy /= l;
                    }
                }

                c.move(c.speed);

                if (c.splitTimer >= SPLIT_INTERVAL && c.alive) {
                    const result = c.split();
                    if (result) {
                        const [p1, p2] = result;
                        const child1 = new Organism('collector', p1.x, p1.y, p1.size, p1.speed);
                        const child2 = new Organism('collector', p2.x, p2.y, p2.size, p2.speed);
                        const a1 = rand(0, Math.PI * 2);
                        const a2 = a1 + Math.PI + rand(-0.5, 0.5);
                        child1.vx = Math.cos(a1);
                        child1.vy = Math.sin(a1);
                        child2.vx = Math.cos(a2);
                        child2.vy = Math.sin(a2);
                        child1.splitTimer = 0;
                        child2.splitTimer = 0;
                        collectors.push(child1);
                        collectors.push(child2);
                        c.alive = false;
                    } else {
                        c.splitTimer = 0;
                    }
                }

                c.size = clamp(c.size, 2, 80);
                c.speed = clamp(c.speed, 0.3, 15);
            }

            const aliveCollectors2 = collectors.filter(c => c.alive);
            for (const p of alivePredators) {
                let target = null;
                let targetDist = Infinity;
                for (const c of aliveCollectors2) {
                    const d = dist(p, c);
                    if (d < targetDist) { targetDist = d;
                        target = c; }
                }

                if (target) {
                    p.steer(target.x, target.y, 0.8);
                    p.wobble(0.02);

                    if (targetDist < p.size + target.size * 0.4) {
                        if (p.target === target.id) {
                            p.huntTime += STEP_DT;
                        } else {
                            p.target = target.id;
                            p.huntTime = 0;
                        }
                        if (p.huntTime >= HUNT_TIME && target.alive) {
                            target.alive = false;
                            const dSize = rand(predatorSizeMin, predatorSizeMax);
                            p.size = Math.max(3, p.size + dSize);
                            const dSpeed = rand(predatorSpeedMin, predatorSpeedMax);
                            p.speed = Math.max(0.3, p.speed + dSpeed);
                            p.huntTime = 0;
                            p.target = null;
                            p.wobble(0.2);
                        }
                    } else {
                        p.target = null;
                        p.huntTime = 0;
                    }
                } else {
                    p.wobble(0.04);
                    if (Math.random() < 0.01) {
                        p.vx = rand(-1, 1);
                        p.vy = rand(-1, 1);
                        const l = Math.hypot(p.vx, p.vy) || 1;
                        p.vx /= l;
                        p.vy /= l;
                    }
                }

                p.move(p.speed);

                if (p.splitTimer >= SPLIT_INTERVAL && p.alive) {
                    const result = p.split();
                    if (result) {
                        const [p1, p2] = result;
                        const child1 = new Organism('predator', p1.x, p1.y, p1.size, p1.speed);
                        const child2 = new Organism('predator', p2.x, p2.y, p2.size, p2.speed);
                        const a1 = rand(0, Math.PI * 2);
                        const a2 = a1 + Math.PI + rand(-0.5, 0.5);
                        child1.vx = Math.cos(a1);
                        child1.vy = Math.sin(a1);
                        child2.vx = Math.cos(a2);
                        child2.vy = Math.sin(a2);
                        child1.splitTimer = 0;
                        child2.splitTimer = 0;
                        predators.push(child1);
                        predators.push(child2);
                        p.alive = false;
                    } else {
                        p.splitTimer = 0;
                    }
                }

                p.size = clamp(p.size, 3, 100);
                p.speed = clamp(p.speed, 0.3, 12);
            }

            collectors = collectors.filter(c => c.alive);
            predators = predators.filter(p => p.alive);
            foods = foods.filter(f => f.alive);

            const targetFood = getParams().foodCount;
            while (foods.length < targetFood) {
                const p = randomPos();
                foods.push({ x: p.x, y: p.y, radius: 3, alive: true });
            }

            const MAX_COLLECTORS = 300;
            const MAX_PREDATORS = 150;
            if (collectors.length > MAX_COLLECTORS) {
                const excess = collectors.length - MAX_COLLECTORS;
                const shuffled = collectors.sort(() => Math.random() - 0.5);
                for (let i = 0; i < excess && i < shuffled.length; i++) {
                    shuffled[i].alive = false;
                }
                collectors = collectors.filter(c => c.alive);
            }
            if (predators.length > MAX_PREDATORS) {
                const excess = predators.length - MAX_PREDATORS;
                const shuffled = predators.sort(() => Math.random() - 0.5);
                for (let i = 0; i < excess && i < shuffled.length; i++) {
                    shuffled[i].alive = false;
                }
                predators = predators.filter(p => p.alive);
            }
        }

        // ---------- 主循环 (加入停止检查) ----------
        function mainLoop(timestamp) {
            // 如果模拟已停止，直接返回，不再请求下一帧
            if (!running) {
                frameId = null;
                return;
            }

            if (paused) {
                frameId = requestAnimationFrame(mainLoop);
                return;
            }

            if (!lastTimestamp) lastTimestamp = timestamp;
            const delta = Math.min((timestamp - lastTimestamp) / 1000, 0.05);
            lastTimestamp = timestamp;
            deltaAccum += delta;

            let steps = 0;
            while (deltaAccum >= STEP_DT && steps < 8) {
                simulateStep();
                simClock += STEP_DT;
                deltaAccum -= STEP_DT;
                steps++;
            }

            if (Math.floor(simClock * 2) % 1 === 0 && steps > 0) {
                recordData();
                updateCharts();
            }

            updateStats();
            drawCanvas();

            statusText.textContent = '运行中';
            statusLed.className = 'led led-green';

            frameId = requestAnimationFrame(mainLoop);
        }

        // ---------- 控制函数 ----------
        function startSimulation() {
            if (running) return;
            const params = getParams();
            if (collectors.length === 0 && predators.length === 0) {
                const pop = createInitialPopulation(params);
                collectors = pop.collectors;
                predators = pop.predators;
                foods = pop.foods;
                initCharts();
                history = {
                    time: [],
                    collectorCount: [],
                    predatorCount: [],
                    collectorAvgSize: [],
                    predatorAvgSize: [],
                    collectorAvgSpeed: [],
                    predatorAvgSpeed: [],
                };
            }
            running = true;
            paused = false;
            lastTimestamp = 0;
            deltaAccum = 0;
            btnStart.disabled = true;
            btnPause.disabled = false;
            btnPause.textContent = '⏸ 暂停';
            statusText.textContent = '运行中';
            statusLed.className = 'led led-green';
            if (frameId) cancelAnimationFrame(frameId);
            frameId = requestAnimationFrame(mainLoop);
        }

        function pauseSimulation() {
            if (!running) return;
            paused = !paused;
            btnPause.textContent = paused ? '▶ 继续' : '⏸ 暂停';
            statusText.textContent = paused ? '已暂停' : '运行中';
            statusLed.className = paused ? 'led-yellow' : 'led-green';
        }

        // ---------- 事件绑定 ----------
        btnStart.addEventListener('click', startSimulation);
        btnPause.addEventListener('click', pauseSimulation);
        btnReset.addEventListener('click', resetSimulation);

        document.querySelectorAll('#controlPanel input').forEach(inp => {
            inp.addEventListener('change', () => {
                const params = getParams();
                hintHuntTime.textContent = params.huntTime.toFixed(1);
                if (!running && !paused) {
                    resetSimulation();
                }
            });
            inp.addEventListener('input', () => {
                const params = getParams();
                hintHuntTime.textContent = params.huntTime.toFixed(1);
            });
        });

        // ---------- 初始化 ----------
        resetSimulation();

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const w = rect.width - 4;
            const ratio = H / W;
            canvas.style.width = w + 'px';
            canvas.style.height = (w * ratio) + 'px';
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                if (running) pauseSimulation();
                else startSimulation();
            }
            if (e.key === 'r' || e.key === 'R') {
                resetSimulation();
            }
        });

        console.log('🌿 自然选择与进化模拟器已加载 (重置已修复)');
        console.log('⌨️  空格: 开始/暂停  |  R: 重置');
    </script>
